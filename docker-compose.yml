services:
  zabbix-db:
    container_name: zabbix-db
    hostname: zabbix-db
    image: mariadb:10.11
#    ports:
#      - 3306:3306
    environment:
      MARIADB_AUTO_UPGRADE: true
      MARIADB_ROOT_PASSWORD: ${ZABBIX_DB_PASS}      
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./zabbix-db:/var/lib/mysql/
#      - ./zabbix-db.cnf:/etc/mysql/conf.d/znuny.cnf

  zabbix-server:
    image: zabbix/zabbix-server-mysql:6.0-alpine-latest
    container_name: zabbix-server
    hostname: zabbix-server
    ports:
      - 10051:10051
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: ${ZABBIX_USER}
      MYSQL_PASSWORD: ${ZABBIX_PASS}

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:6.0-alpine-latest
    container_name: zabbix-web
    hostname: zabbix-web
    ports:
      - 8081:8080
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: ${ZABBIX_USER}
      MYSQL_PASSWORD: ${ZABBIX_PASS}
    depends_on:
      - zabbix-server

  zabbix-agent:
    image: zabbix/zabbix-agent:6.0-alpine-latest
    container_name: zabbix-agent
    hostname: zabbix-agent
    ports:
    - "10050:10050"
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - /etc/timezone:/etc/timezone:ro
#    - ./zbx_env/etc/zabbix/zabbix_agentd.d:/etc/zabbix/zabbix_agentd.d:ro
#    - ./zbx_env/var/lib/zabbix/modules:/var/lib/zabbix/modules:ro
#    - ./zbx_env/var/lib/zabbix/enc:/var/lib/zabbix/enc:ro
#    - ./zbx_env/var/lib/zabbix/ssh_keys:/var/lib/zabbix/ssh_keys:ro
#    environment:
#      ZBX_HOSTNAME: zabbix-server
    #   ZBX_SERVER_HOST: zabbix-server
    links:
    - zabbix-server:zabbix-server
#    env_file:
#    - .env_agent
    user: root
    privileged: true
    pid: "host"